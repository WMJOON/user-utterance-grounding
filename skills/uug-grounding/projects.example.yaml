# projects.yaml 템플릿 — 이 파일을 projects.yaml 로 복사하고 본인 프로젝트를 등록한다.
# (projects.yaml 은 본인 환경의 프로젝트 레지스트리. 이 example 은 추상화/배포용 샘플.)
#
# 각 항목:
#   anchor   : machine.yaml 의 앵커명 (vault/code/home 등). 위치의 머신-무관 기준점.
#   rel      : 앵커 상대경로.
#   aliases  : (v0.3.0) explicit — 프로젝트를 직접 부르는 이름·별칭. `ug locate/infer` 에서 항상 확정.
#   keywords : tacit — 주제로 프로젝트를 암시하는 말. `ug locate/infer` 에서는 발화 태깅 학습 분포
#              (uug-pattern-analytics keyword_map.py)로 판정: 한쪽으로 모이면 추정, 갈라지면 clarify.
#              (ground/dispatch 의 target_project 추론은 aliases + keywords 를 함께 쓴다.)
#   tags     : 분류용(선택).
#   intent_registry : (선택) 그 프로젝트의 *도메인* intent TTL (프로젝트 루트 anchor+rel 상대경로).
#                     선언 시 grounding 이 user intent + 그 도메인 intent 를 합쳐 ground 한다
#                     (§11 멀티-레지스트리 브리지). 도메인 intent 가 매칭되면 target_project 함의.
#                     레지스트리는 namespace 무관(술어 로컬명 기준) — MSO mso: 등 그대로 사용.
# ※ 절대경로는 여기 두지 않는다 → machine.yaml(로컬)이 anchor→절대경로.
# ※ intent 정의는 여기 아님 → instances/user_intents.ttl.

my-main-repo:
  anchor: vault
  rel: path/to/main-repo
  aliases: ["main repo", "메인 레포"]         # explicit
  keywords: ["메인", "배포"]                  # tacit
  tags: [example]

my-knowledge-base:
  anchor: vault
  rel: path/to/kb
  aliases: ["KB", "지식베이스"]
  keywords: ["노트", "리서치"]
  tags: [example, knowledge-base]

# 도메인 레지스트리 브리지 예시 — 이 프로젝트의 운영 intent(예: MSO dispatch_ticket)를
# UUG 가 ground 할 수 있게 한다. dispatch 까지 선언하면 `ug dispatch` 가 그 intent 의
# 뒷단(intent→action)을 이 프로젝트의 CLI 에 subprocess 위임한다(§11 UUG→프로젝트 배선).
my-orchestrator:
  anchor: vault
  rel: path/to/orchestrator
  aliases: ["오케스트레이터"]
  keywords: ["티켓", "dispatch"]
  tags: [example, orchestrator]
  intent_registry: repository/skills/intent-registry/instances/intents.ttl
  dispatch:                                   # (선택) 도메인 intent 뒷단 위임 진입점
    kind: cli                                 # 현재 지원: cli (subprocess 경계)
    entry: repository/skills/intent-registry/src/pipeline.py   # `python entry ground --intent-id X --utterance "..."`
